const $=id=>document.getElementById(id);
const EXTRA={
ru:['1. Снять штрихкод','Снимите штрихкод крупно, целиком, с белыми полями по краям.','Остановить','2. Фото товара на белом фоне','Скачать ZIP','Фото хранятся на этом устройстве. Регулярно экспортируйте ZIP; не очищайте данные сайта.'],

let db,controls=null,scanning=false,scanToken=0,processing=false,saving=false,previewURL,downloadURL;
function msg(s){$('status').textContent=s}
function translate(){const lang=$('language').value;document.documentElement.lang=lang;const t=T[lang];['heading','eanlabel','scan','photolabel','save','listtitle','export'].forEach((id,i)=>$(id).textContent=t[i]);EXTRA[lang].forEach((v,i)=>$(['barcodeButton','tip','stop','photolabel','download','storageTip'][i]).textContent=v)}
$('language').onchange=translate;translate();
function validGTIN(s){if(!/^(?:\d{8}|\d{12}|\d{13}|\d{14})$/.test(s))return false;let n=0;for(let i=s.length-2,j=0;i>=0;i--,j++)n+=Number(s[i])*(j%2?1:3);return (10-n%10)%10===Number(s.at(-1))}
function setCode(code){if(!validGTIN(code))return false;$('ean').value=code;msg('EAN: '+code+' — код распознан. Теперь сфотографируйте товар.');return true}
function newReader(){return new ZXingBrowser.BrowserMultiFormatOneDReader()}
const req=indexedDB.open('product-photo-catalog',1);
req.onupgradeneeded=e=>e.target.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
req.onsuccess=e=>{db=e.target.result;refresh()};
req.onerror=()=>msg('Не удалось открыть локальную базу. Попробуйте обычную вкладку Safari.');
function all(){return new Promise((resolve,reject)=>{if(!db){reject(Error('Каталог ещё не открыт'));return}const q=db.transaction('photos','readonly').objectStore('photos').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function refresh(){try{let rows=await all();$('count').textContent=rows.length+' шт.';$('items').replaceChildren(...rows.slice().reverse().map(r=>{let li=document.createElement('li');li.textContent=r.ean+' — '+new Date(r.time).toLocaleString();return li}))}catch(e){msg(e.message)}}
function stopScan(){scanToken++;scanning=false;controls?.stop();controls=null;const stream=$('video').srcObject;stream?.getTracks().forEach(t=>t.stop());$('video').srcObject=null;$('video').hidden=true;$('stop').hidden=true}
$('stop').onclick=stopScan;
$('scan').onclick=async()=>{
 if(scanning){stopScan();return}if(processing)return;
 scanning=true;const token=++scanToken;$('video').hidden=false;$('stop').hidden=false;msg('Наведите камеру на штрихкод. Или используйте «Снять штрихкод».');
 try{const c=await newReader().decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},$('video'),(result,error,c)=>{if(token!==scanToken){c?.stop();return}if(result&&setCode(result.getText())){c?.stop();stopScan()}});if(token!==scanToken)c.stop();else controls=c}
 catch(e){if(token===scanToken){stopScan();msg('Не удалось открыть видеосканер. Разрешите камеру в Safari или нажмите «Снять штрихкод».')}}
};
$('barcodeButton').onclick=()=>{stopScan();$('barcodePhoto').click()};
// Decode the actual barcode locally; no upload and no OCR guesses.
async function decodePhoto(file){
 const url=URL.createObjectURL(file),img=new Image();
 try{await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(Error('Формат фото не читается. Переснимите через камеру сайта.'));img.src=url});
 const reader=newReader();
 for(const angle of [0,90,180,270]){
  for(const crop of [1,0.65]){
   const sw=img.naturalWidth,sh=img.naturalHeight;
   const scale=Math.min(1,2000/Math.max(sw,sh)),w=Math.round(sw*scale),h=Math.round(sh*scale);
   const c=document.createElement('canvas');c.width=angle%180?h:w;c.height=angle%180?w:h;
   const ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.translate(c.width/2,c.height/2);ctx.rotate(angle*Math.PI/180);
   ctx.drawImage(img,(sw-sw*crop)/2,(sh-sh*crop)/2,sw*crop,sh*crop,-w/2,-h/2,w,h);
   try{const result=await reader.decodeFromCanvas(c);if(validGTIN(result.getText()))return result.getText()}catch(e){}
   await new Promise(r=>setTimeout(r,0));
  }
 }
 throw Error('Штрихкод не распознан. Снимите ближе, без бликов и без обрезанных краёв.');
 }finally{URL.revokeObjectURL(url)}
}
$('barcodePhoto').onchange=async()=>{const file=$('barcodePhoto').files[0];if(!file)return;processing=true;$('barcodeButton').disabled=true;$('save').disabled=true;$('ean').value='';msg('Читаю штрихкод с фотографии…');try{setCode(await decodePhoto(file))}catch(e){msg(e.message)}finally{processing=false;$('barcodeButton').disabled=false;$('save').disabled=false;$('barcodePhoto').value=''}};
$('photo').onchange=()=>{stopScan();if(previewURL)URL.revokeObjectURL(previewURL);const f=$('photo').files[0];$('preview').hidden=!f;if(f){previewURL=URL.createObjectURL(f);$('preview').src=previewURL}};
$('save').onclick=async()=>{
 if(saving||processing)return;const ean=$('ean').value.trim(),file=$('photo').files[0];
 if(!validGTIN(ean)){msg('Нужен корректный EAN/GTIN (8, 12, 13 или 14 цифр). Снимите штрихкод или проверьте цифры.');return}
 if(!file){msg('Сначала сфотографируйте сам товар.');return}if(!db){msg('Локальная база ещё не открыта.');return}
 saving=true;$('save').disabled=true;
 try{const existing=await all();if(existing.some(r=>r.ean===ean)&&!confirm('Этот EAN уже есть. Сохранить ещё один снимок?'))return;
 await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').add({ean,photo:file,time:new Date().toISOString(),type:file.type,originalName:file.name});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Запись отменена'))});
 $('ean').value='';$('photo').value='';$('preview').hidden=true;if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null}await refresh();msg('Сохранено на этом устройстве. Можно снимать следующий товар.');
 }catch(e){msg('Не удалось сохранить: '+e.message+'. Не закрывайте страницу; проверьте свободное место.')}finally{saving=false;$('save').disabled=false}
};
function extension(r){const types={'image/png':'png','image/jpeg':'jpg','image/heic':'heic','image/heif':'heif','image/webp':'webp','image/avif':'avif'};return types[r.type]||((r.originalName||r.photo.name||'').match(/\.([a-z0-9]+)$/i)||[])[1]||'bin'}
$('export').onclick=async()=>{const btn=$('export');btn.disabled=true;try{const rows=await all();if(!rows.length){msg('Пока нет товаров для экспорта.');return}msg('Создаю архив…');const zip=new JSZip(),manifest=[];rows.forEach((r,i)=>{const name=r.ean+'_'+String(i+1).padStart(4,'0')+'.'+extension(r);zip.file('photos/'+name,r.photo);manifest.push({ean:r.ean,file:name,time:r.time})});zip.file('catalog.json',JSON.stringify(manifest,null,2));const blob=await zip.generateAsync({type:'blob'});if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);$('download').href=downloadURL;$('download').download='catalog_export.zip';$('download').hidden=false;msg('Архив готов. Нажмите «Скачать ZIP» и сохраните в «Файлы».');}catch(e){msg('Ошибка экспорта: '+e.message)}finally{btn.disabled=false}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScan()});
window.addEventListener('pagehide',stopScan);
</script></body></html>
