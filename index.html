<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Каталог товаров</title><style>
body{font:17px -apple-system,system-ui;background:#f5f5f7;color:#151515;margin:0;padding:22px;max-width:600px;margin:auto}h1{font-size:26px}button,input,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #ccc}button{background:#1565c0;color:white;border:0;margin:6px 4px 6px 0}button:disabled{opacity:.4}input{box-sizing:border-box;width:100%}video,img{width:100%;border-radius:12px;background:#ddd}section{background:white;padding:16px;border-radius:18px;margin:14px 0}small{color:#666}li{margin:10px 0;word-break:break-word}
</style></head><body><h1 id="heading">Каталог товаров</h1><select id="language"><option value="ru">Русский</option><option value="uk">Українська</option><option value="de">Deutsch</option><option value="en">English</option><option value="pl">Polski</option></select>
<section><label id="eanlabel" for="ean">Штрихкод EAN</label><input id="ean" inputmode="numeric" placeholder="EAN / GTIN"><button id="scan">Сканировать</button><video id="video" autoplay muted playsinline hidden></video><small id="status"></small></section>
<section><label id="photolabel" for="photo">Фото товара</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden><button id="save">Сохранить товар</button></section>
<section><h2 id="listtitle">Сохранённые товары</h2><small id="count"></small><ul id="items"></ul><button id="export">Экспорт ZIP</button></section>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const T={ru:['Каталог товаров','Штрихкод EAN','Сканировать','Фото товара','Сохранить товар','Сохранённые товары','Экспорт ZIP'],uk:['Каталог товарів','Штрихкод EAN','Сканувати','Фото товару','Зберегти товар','Збережені товари','Експорт ZIP'],de:['Produktkatalog','EAN-Barcode','Scannen','Produktfoto','Produkt speichern','Gespeicherte Produkte','ZIP exportieren'],en:['Product catalog','EAN barcode','Scan','Product photo','Save product','Saved products','Export ZIP'],pl:['Katalog produktów','Kod EAN','Skanuj','Zdjęcie produktu','Zapisz produkt','Zapisane produkty','Eksportuj ZIP']};
const $=id=>document.getElementById(id);let db,reader,controls;
$('language').onchange=()=>{let t=T[$('language').value];['heading','eanlabel','scan','photolabel','save','listtitle','export'].forEach((id,i)=>$(id).textContent=t[i])};
const req=indexedDB.open('product-photo-catalog',1);
req.onupgradeneeded=e=>e.target.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
req.onsuccess=e=>{db=e.target.result;refresh()};
req.onerror=()=>msg('Не удалось открыть локальную базу');
function msg(s){$('status').textContent=s}
function store(mode='readonly'){return db.transaction('photos',mode).objectStore('photos')}
function all(){return new Promise((res,rej)=>{let q=store().getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function refresh(){if(!db)return;let rows=await all();$('count').textContent=rows.length+' шт.';$('items').replaceChildren(...rows.slice().reverse().map(r=>{let li=document.createElement('li');li.textContent=r.ean+' — '+new Date(r.time).toLocaleString();return li}))}
$('scan').onclick=async()=>{try{if(!window.ZXingBrowser)throw Error('Сканер не загружен: требуется интернет для библиотек');if(controls){controls.stop();controls=null;$('video').hidden=true;return}reader=new ZXingBrowser.BrowserMultiFormatReader();$('video').hidden=false;controls=await reader.decodeFromVideoDevice(undefined,$('video'),(result)=>{if(result){$('ean').value=result.getText();controls?.stop();controls=null;$('video').hidden=true;msg('EAN: '+result.getText())}})}catch(e){msg('Ошибка камеры: '+e.message)}};
$('photo').onchange=()=>{let f=$('photo').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').hidden=false}};
$('save').onclick=()=>{let ean=$('ean').value.trim(),file=$('photo').files[0];if(!/^\d{8,14}$/.test(ean)){msg('Введите штрихкод из 8–14 цифр');return}if(!file){msg('Сначала сделайте фото');return}let q=store('readwrite').add({ean,photo:file,time:new Date().toISOString(),type:file.type});q.onsuccess=()=>{msg('Сохранено на этом iPhone');$('ean').value='';$('photo').value='';$('preview').hidden=true;refresh()};q.onerror=()=>msg('Ошибка сохранения: '+q.error)};
$('export').onclick=async()=>{try{if(!window.JSZip)throw Error('Библиотека ZIP не загружена');let rows=await all(),zip=new JSZip();let manifest=[];rows.forEach((r,i)=>{let ext=r.type==='image/png'?'png':r.type==='image/heic'?'heic':'jpg';let name=r.ean+'_'+String(i+1).padStart(4,'0')+'.'+ext;zip.file('photos/'+name,r.photo);manifest.push({ean:r.ean,file:name,time:r.time})});zip.file('catalog.json',JSON.stringify(manifest,null,2));let blob=await zip.generateAsync({type:'blob'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalog_export.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);msg('ZIP создан. Сохраните его через меню iPhone.')}catch(e){msg('Ошибка экспорта: '+e.message)}};
</script></body></html>
